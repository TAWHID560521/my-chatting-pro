services:
  - type: web
    name: my-chatting-pro-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: my-chatting-pro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: my-chatting-pro-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  - name: my-chatting-pro-db
    plan: starter
